<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dffc4"/>
      <stop offset="0.5" stop-color="#e9fffb"/>
      <stop offset="1" stop-color="#c58bff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="linha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5dffb4" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5dffb4"/>
      <stop offset="0.6" stop-color="#2fd8d0"/>
      <stop offset="0.8" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="brilho" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: 2px; }
  </style>
  <text class="t" x="450" y="48" text-anchor="middle" fill="url(#g)" filter="url(#brilho)">✦  LET'S CONNECT</text>
  <rect x="150" y="66" width="600" height="2" fill="url(#linha)"/>
  <rect x="150" y="64" width="600" height="6" fill="url(#linha)" filter="url(#blur)" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cy="67" r="3" fill="#ffffff" filter="url(#brilho)">
    <animate attributeName="cx" values="160;740;160" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
